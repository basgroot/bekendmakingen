name: Cleanup old workflow runs

on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '14 days ago' +%s)

          gh run list \
            --repo "$REPO" \
            --limit 1000 \
            --json databaseId,createdAt \
            --jq ".[] | select((.createdAt | fromdateiso8601) < $cutoff) | .databaseId" |
          while read -r id; do
            [ -z "$id" ] && continue
            echo "Deleting run: $id"
            gh run delete "$id" --repo "$REPO"
          done
