# Lint and format check for every push and pull request to main.
# Runs ESLint and Prettier via `npm run check`, then rebuilds the minified
# assets and fails when they differ from what is committed. A second job
# byte-compiles and lints the Python in scripts/, which otherwise has no
# automated verification at all despite running unattended from history.yml.
# Docs: https://docs.github.com/en/actions/automating-builds-and-tests
name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint, format & build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # history/ holds many JSON files. A shallow clone still downloads
          # every blob of the tip commit, so without a partial clone this job
          # transfers gigabytes to lint a handful of files. blob:none fetches
          # blobs on demand and the sparse checkout keeps that demand to the
          # paths below. Cone mode always adds the files in the repository
          # root, which is where map.js and the tool configuration live.
          # This set matches what the linters actually read: eslint.config.mjs
          # ignores history/, and .prettierignore excludes history/, img/,
          # manual/ and .opencode/.
          filter: blob:none
          sparse-checkout: |
            .github
            .githooks
            scripts

      # `eslint .` and `prettier --check .` both exit 0 when they find no
      # files, so a sparse checkout that silently went wrong would turn this
      # job green without checking anything.
      - name: Verify the checkout is complete
        run: |
          for FILE in map.js map.css map.min.js map.min.css \
                      index.html package.json package-lock.json eslint.config.mjs \
                      .prettierrc .prettierignore .githooks/pre-commit.cjs \
                      scripts/minify-css.mjs .github/workflows/ci.yml; do
            [ -f "$FILE" ] || { echo "ERROR: $FILE is missing from the sparse checkout"; exit 1; }
          done
          if [ -d history ]; then
            echo "ERROR: history/ was checked out, so the sparse pattern is not being applied"
            exit 1
          fi
          echo "Checked out $(find . -path ./.git -prune -o -type f -print | wc -l) files."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint and format check
        run: npm run check

      # map.min.js and map.min.css are committed build output, and they are what
      # the site actually serves. Nothing else in this job looks at them:
      # eslint.config.mjs ignores **/*.min.js and .prettierignore excludes
      # *.min.js and *.min.css. Until now the only thing keeping them in step
      # with map.js and map.css was the pre-commit hook, which is skipped by
      # `git commit --no-verify`. Rebuilding here and comparing catches that,
      # and it also catches a dependabot bump of terser or clean-css that
      # changes the output without anyone touching the sources.
      - name: Verify minified assets are up to date
        run: |
          npm run build
          if ! git diff --quiet -- map.min.js map.min.css; then
            echo "ERROR: the committed minified assets do not match their sources."
            git diff --stat -- map.min.js map.min.css
            echo "Run 'npm run build' and commit map.min.js and/or map.min.css."
            exit 1
          fi
          echo "map.min.js and map.min.css are up to date."

  python:
    name: Python static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Same reasoning as the job above: history/ makes a full checkout
          # expensive. Cone mode always adds the repository root, which is where
          # ruff.toml lives, so scripts/ is all that has to be asked for.
          filter: blob:none
          sparse-checkout: |
            scripts

      # ruff exits 0 with only a warning when it finds no Python files at all, so
      # a sparse checkout that silently went wrong would turn this job green
      # without checking anything.
      - name: Verify the checkout is complete
        run: |
          for FILE in scripts/fetch_history.py ruff.toml; do
            [ -f "$FILE" ] || { echo "ERROR: $FILE is missing from the sparse checkout"; exit 1; }
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Pinned rather than "3.x", because history.yml runs the script with
          # the python3 of the runner image and this is the version that has to
          # match it. Give history.yml an actions/setup-python step with this
          # same version, otherwise an image rotation makes CI check the script
          # against a different interpreter than the one that runs it nightly.
          python-version: "3.12"

      # The real CPython compiler for the target version, not a third-party
      # parser. A syntax error in a script that runs unattended at 04:17 UTC with
      # contents: write would otherwise first surface in production.
      - name: Byte-compile
        run: python -m compileall -q scripts/

      # The version is pinned on purpose: ruff has widened its default rule set
      # between releases, so an unpinned run would silently change what CI
      # enforces. ruff.toml pins the rules themselves.
      - name: Lint
        run: |
          python -m pip install --quiet ruff==0.16.3
          ruff --version
          ruff check scripts/
