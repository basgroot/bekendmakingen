version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    cooldown:
      default-days: 2
    groups:
      npm-dev:
        dependency-type: "development"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    cooldown:
      default-days: 2
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    cooldown:
      default-days: 2
    commit-message:
      prefix: "chore"
      include: "scope"
